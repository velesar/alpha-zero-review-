[package]
name = "setup-cli"
version = "0.1.0"
edition = "2021"
description = "Setup CLI for AI Code Audit Agent - configures MCP servers for different AI CLI tools"

[[bin]]
name = "setup-audit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1.0"
dirs = "5"

[dev-dependencies]
tempfile = { workspace = true }
