[workspace]
resolver = "2"
members = ["mental-model-server", "methodology-kb-server", "sarif-tools-server", "codegraph-server"]

[workspace.dependencies]
rmcp = { version = "0.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1.0"
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
glob = "0.3"
# Beta-Zero additions
which = "7"
tempfile = "3"
prost = "0.13"
prost-build = "0.13"
