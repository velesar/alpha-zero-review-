# Code Coverage Workflow
# Measures coverage with cargo-llvm-cov, enforces the floors in
# scripts/check-coverage.py and uploads an lcov report to Codecov.

name: Code Coverage

on:
  push:
    branches: [claude/ai-code-audit-agent-YtOaA, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # clippy: the sarif-tools MCP tests run clippy on a scratch crate
          components: llvm-tools-preview, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --no-report

      - name: Coverage reports
        run: |
          cargo llvm-cov report --json --summary-only --output-path cov.json
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage floors
        run: python3 scripts/check-coverage.py cov.json

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
