# Critical Path Thresholds (applied to specific paths)
- project_type: critical_path
  language: null
  description: Stricter thresholds for business-critical code paths
  applies_to_paths:
    - "*/payment/*"
    - "*/billing/*"
    - "*/auth/*"
    - "*/security/*"
  metrics:
    test_coverage:
      healthy: 95
      warning: 85
      critical: 70
    branch_coverage:
      healthy: 90
      warning: 80
      critical: 65
    vulnerability_count:
      healthy: 0
      warning: 0
      critical: 0
    cognitive_complexity:
      healthy: 8
      warning: 12
      critical: 18
