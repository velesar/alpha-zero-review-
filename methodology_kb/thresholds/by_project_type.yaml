# Thresholds by Project Type
# Different project types have different quality expectations

# Greenfield projects - new code should be high quality
- project_type: greenfield
  language: null
  metrics:
    cognitive_complexity:
      healthy: 8
      warning: 12
      critical: 20
    cyclomatic_complexity:
      healthy: 8
      warning: 15
      critical: 30
    test_coverage:
      healthy: 85
      warning: 70
      critical: 50
    branch_coverage:
      healthy: 80
      warning: 60
      critical: 40
    code_duplication:
      healthy: 2
      warning: 4
      critical: 7
    maintainability_index:
      healthy: 70
      warning: 50
      critical: 30
    technical_debt_ratio:
      healthy: 3
      warning: 7
      critical: 15
    vulnerability_count:
      healthy: 0
      warning: 0
      critical: 1

