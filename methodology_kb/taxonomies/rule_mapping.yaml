# ESLint Rules (JavaScript/TypeScript)
- tool: eslint
  rule_id: no-eval
  category: security_injection
  base_severity: CRITICAL
  description: eval() usage

- tool: eslint
  rule_id: no-implied-eval
  category: security_injection
  base_severity: HIGH
  description: Implied eval()

- tool: eslint
  rule_id: no-new-func
  category: security_injection
  base_severity: HIGH
  description: Function constructor

- tool: eslint
  rule_id: security/detect-sql-injection
  category: security_injection
  base_severity: HIGH
  description: SQL injection

- tool: eslint
  rule_id: security/detect-non-literal-regexp
  category: security
  base_severity: MEDIUM
  description: ReDoS vulnerability

- tool: eslint
  rule_id: security/detect-object-injection
  category: security
  base_severity: MEDIUM
  description: Object injection

- tool: eslint
  rule_id: complexity
