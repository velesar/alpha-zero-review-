  base_severity: MEDIUM
  description: High cyclomatic complexity

- tool: eslint
  rule_id: max-depth
  category: maintainability_complexity
  base_severity: LOW
  description: Deep nesting

- tool: eslint
  rule_id: max-lines-per-function
  category: maintainability_complexity
  base_severity: LOW
  description: Function too long

