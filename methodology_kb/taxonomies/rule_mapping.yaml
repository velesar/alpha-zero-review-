# Rule Mapping
# Maps tool-specific rule IDs to categories and base severity
# Version: 2.0 (Beta-Zero enhanced with Ruff and Trivy support)

# Semgrep Rules
- tool: semgrep
  rule_id: python.lang.security.audit.dangerous-subprocess-use
  category: security_injection
  base_severity: HIGH
  description: Command injection via subprocess

- tool: semgrep
  rule_id: python.lang.security.audit.exec-detected
  category: security_injection
  base_severity: CRITICAL
  description: Code execution via exec()

- tool: semgrep
  rule_id: python.lang.security.audit.eval-detected
  category: security_injection
  base_severity: CRITICAL
  description: Code execution via eval()

- tool: semgrep
  rule_id: python.django.security.audit.xss
  category: security_xss
  base_severity: HIGH
  description: Cross-site scripting in Django

- tool: semgrep
  rule_id: python.flask.security.audit.xss
  category: security_xss
  base_severity: HIGH
  description: Cross-site scripting in Flask

- tool: semgrep
  rule_id: python.lang.security.insecure-hash-algorithms
  category: security_crypto
  base_severity: MEDIUM
  description: Use of insecure hash algorithm

- tool: semgrep
  rule_id: python.lang.security.audit.hardcoded-password
  category: security_auth
  base_severity: HIGH
  description: Hardcoded password or secret

- tool: semgrep
  rule_id: javascript.express.security.audit.express-ssrf
  category: security
  base_severity: HIGH
  description: Server-side request forgery

- tool: semgrep
  rule_id: javascript.lang.security.audit.prototype-pollution
  category: security
  base_severity: HIGH
  description: Prototype pollution vulnerability

- tool: semgrep
  rule_id: typescript.react.security.audit.react-dangerouslysetinnerhtml
  category: security_xss
  base_severity: MEDIUM
  description: Dangerous HTML rendering in React

