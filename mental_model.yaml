findings:
- id: F-99182349
  viewpoint: VP-Q01
  category: security
  title: No Path Validation on File Operations
  description: The mental model server reads and writes files based on user-provided paths without validating that the path is within expected boundaries. While this is a local tool, path traversal could allow reading/writing arbitrary files if the model_path is manipulated.
  file_path: mental-model-server/src/server.rs
  line_number: 112
  base_severity: LOW
  adjusted_severity: MEDIUM
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    is_hotspot: false
  recommendation: Consider canonicalizing paths and validating they remain within expected directories.
- id: F-ECE3F87E
  viewpoint: VP-Q01
  category: security
  title: YAML Deserialization Without Strict Schema Validation
  description: Both servers deserialize YAML files from disk without strict schema validation. Malformed or maliciously crafted YAML files could cause unexpected behavior. The code uses unwrap_or_default() which silently ignores parsing errors.
  file_path: mental-model-server/src/server.rs
  line_number: 98
  base_severity: LOW
  adjusted_severity: MEDIUM
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    is_hotspot: false
  recommendation: Add logging when deserialization fails and consider validating against JSON schema.
- id: F-3AAE0AE7
  viewpoint: VP-Q01
  category: security
  title: No Input Validation on Viewpoint IDs
  description: The update_viewpoint function accepts arbitrary viewpoint IDs without validation. Unknown viewpoint IDs are silently accepted and marked as completed without applying any schema validation to the data.
  file_path: mental-model-server/src/model.rs
  line_number: 487
  base_severity: LOW
  adjusted_severity: MEDIUM
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    layer: model
    is_hotspot: false
  recommendation: Validate viewpoint IDs against a known list and require schema-compliant data for each viewpoint type.
- id: F-451B410E
  viewpoint: VP-Q02
  category: performance
  title: Full Model Serialization on Every Save
  description: The save_model() function serializes and writes the entire mental model to disk on every operation (init, update_viewpoint, add_finding, synthesize). For large audits with many findings, this could become slow.
  file_path: mental-model-server/src/server.rs
  line_number: 112
  base_severity: LOW
  adjusted_severity: MEDIUM
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    is_hotspot: false
  recommendation: Consider batching saves or implementing incremental updates for frequently modified sections.
- id: F-474023AA
  viewpoint: VP-Q02
  category: performance
  title: Synchronous File I/O in Async Context
  description: File operations (fs::read_to_string, fs::write) are synchronous and block the tokio runtime. While acceptable for small files, this could impact responsiveness for larger knowledge bases or model files.
  file_path: methodology-kb-server/src/server.rs
  line_number: 125
  base_severity: LOW
  adjusted_severity: LOW
  context:
    bounded_context: MethodologyKB
    bounded_context_type: supporting
    is_hotspot: false
  recommendation: Consider using tokio::fs for async file operations or spawn_blocking for synchronous operations.
- id: F-E485C450
  viewpoint: VP-Q03
  category: testability
  title: Limited Unit Test Coverage
  description: Only 5 unit tests exist across both crates (3 in model.rs, 2 in server.rs). Key functionality like MCP tool handlers, KB loading, and compliance checking lacks test coverage.
  file_path: mental-model-server/src/model.rs
  line_number: 594
  base_severity: MEDIUM
  adjusted_severity: HIGH
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    layer: model
    is_hotspot: false
  recommendation: Add unit tests for MCP tool handlers, severity adjustment logic, and KB loading. Consider property-based testing for serialization round-trips.
- id: F-2AF2A235
  viewpoint: VP-Q03
  category: testability
  title: No Integration Tests
  description: No integration tests exist to verify end-to-end MCP server functionality, tool invocation, or multi-viewpoint workflows. The tests/ directory is missing.
  file_path: mental-model-server/
  base_severity: MEDIUM
  adjusted_severity: HIGH
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    is_hotspot: false
  recommendation: Add integration tests that exercise the MCP protocol, including init_model → update_viewpoint → add_finding → synthesize workflows.
- id: F-84FF4D6A
  viewpoint: VP-Q04
  category: maintainability
  title: Inconsistent Error Handling Pattern
  description: 'Error handling is inconsistent: some functions return Result<T>, while MCP tool handlers return String with embedded error messages. This makes error propagation and handling difficult to reason about.'
  file_path: mental-model-server/src/server.rs
  line_number: 121
  base_severity: LOW
  adjusted_severity: MEDIUM
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    is_hotspot: false
  recommendation: Consider using a consistent error type across the codebase. MCP tools could return structured error responses.
- id: F-7BC5032F
  viewpoint: VP-Q04
  category: maintainability
  title: RwLock Pattern Could Cause Contention
  description: The mental model uses RwLock<MentalModel> with write locks acquired for most operations. Since MCP is typically single-threaded per server instance, this adds unnecessary complexity without benefit.
  file_path: mental-model-server/src/server.rs
  line_number: 18
  base_severity: LOW
  adjusted_severity: MEDIUM
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    is_hotspot: false
  recommendation: Consider using RefCell for single-threaded scenarios or document why thread-safety is required.
- id: F-52F265DE
  viewpoint: VP-Q05
  category: maintainability
  title: Missing Function-Level Documentation
  description: While module-level documentation is good, many public functions lack doc comments explaining their purpose, parameters, return values, and potential errors. Examples include adjust_severity(), synthesize_by_category(), and generate_recommendations().
  file_path: mental-model-server/src/server.rs
  line_number: 334
  base_severity: LOW
  adjusted_severity: MEDIUM
  context:
    bounded_context: MentalModel
    bounded_context_type: core
    is_hotspot: false
  recommendation: Add rustdoc comments to all public functions, especially those with complex logic like severity adjustment.
- id: F-5A3805BA
  viewpoint: VP-Q05
  category: maintainability
  title: No CI/CD Pipeline Documentation
  description: The project lacks CI/CD configuration and documentation on how to build, test, and deploy the MCP servers. The README mentions building but doesn't cover testing or release processes.
  file_path: README.md
  base_severity: LOW
  adjusted_severity: LOW
  context:
    is_hotspot: false
  recommendation: Add GitHub Actions workflow for CI (build, test, lint) and document the release process.
